# Opt-in customer-approved deployment only; no BMS connection is created by default.
# Start from a private, permissioned site runbook. NEVER use this to imply field validation.
services:
  buildopt-edge:
    build: .
    environment:
      GATEWAY_ID: ${GATEWAY_ID:?Set approved gateway ID}
      BUILDING_ID: ${BUILDING_ID:?Set approved customer building ID}
      TENANT_ID: ${TENANT_ID:?Set approved tenant ID}
      CLOUD_API_URL: ${CLOUD_API_URL:?Set approved HTTPS BuildOpt endpoint}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set issued scoped gateway token}
      EDGE_CONNECTOR: ${EDGE_CONNECTOR:?Select explicitly validated connector}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      EDGE_QUEUE_DB: /data/edge_queue.db
      MAPPED_POINTS_FILE: /config/mapped_points.json
    volumes:
      - edge-data:/data
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  edge-data:
