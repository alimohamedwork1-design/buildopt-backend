name: Spatial Core connector checks
on:
  push:
    branches: [main]
    paths: ['integrations/spatial_core_client.py', 'integrations/test_spatial_core_client.py', '.github/workflows/spatial-core-connector.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s integrations -p test_spatial_core_client.py -v
