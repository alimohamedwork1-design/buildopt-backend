name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  demo-regression:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      APP_ENV: development
      INGEST_API_KEY: test-ingest-key
      SECRET_KEY: test-secret-key-not-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-railway.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run full demo regression suite
        run: python -m pytest tests/ -q --cov=app/services --cov-report=term-missing

  live-integrity:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "false"
      APP_ENV: production
      INGEST_API_KEY: test-ingest-key
      SECRET_KEY: test-secret-key-not-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-railway.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run production/live integrity suite
        run: |
          python -m pytest \
            tests/test_live_api_integrity.py \
            tests/test_live_data_production.py \
            tests/test_ingest_production.py \
            tests/test_account_platform.py \
            tests/test_product_truth.py \
            tests/test_productization.py \
            tests/test_data_integrity.py \
            tests/test_ml.py \
            -q --cov=app/services --cov-report=term-missing
