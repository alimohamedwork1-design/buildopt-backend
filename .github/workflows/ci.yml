name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo_mode: "true"
            test_scope: "tests/"
          - demo_mode: "false"
            test_scope: "tests/test_account_platform.py tests/test_data_integrity.py tests/test_ingest_production.py tests/test_live_data_production.py tests/test_phase3_telemetry.py tests/test_phase4.py tests/test_phase5.py tests/test_phase6.py tests/test_phases8_13.py tests/test_telemetry_batch.py tests/test_telemetry_store_backend.py tests/test_supabase_telemetry_store.py tests/test_jci_security.py"
    env:
      DEMO_MODE: ${{ matrix.demo_mode }}
      APP_ENV: production
      INGEST_API_KEY: test-ingest-key
      SECRET_KEY: test-secret-key-not-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-railway.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run tests with coverage
        run: python -m pytest ${{ matrix.test_scope }} -q --cov=app/services --cov-report=term-missing
